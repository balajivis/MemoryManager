# Catch-all for requests by IP address or unknown host names. Serves the dev-vm test
# page (/var/www/html) to the owner's IP only; everyone else gets 403. The owner's IP is kept out of
# the (public) repo: it lives in /etc/nginx/snippets/owner-allow.conf on the VM ('allow <ip>;'). Ports 80/443
# are public because of the landing page, so this keeps the test box private.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    include /etc/nginx/snippets/owner-allow*.conf;
    deny all;

    location / {
        try_files $uri $uri/ =404;
    }
}
