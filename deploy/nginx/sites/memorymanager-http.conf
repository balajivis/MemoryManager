# memorymanager.getkapi.com before a TLS certificate exists: serves the site over
# plain HTTP and answers Let's Encrypt's HTTP-01 challenge. deploy.sh switches to
# memorymanager-https.conf once /etc/letsencrypt/live/memorymanager.getkapi.com exists.

server {
    listen 80;
    listen [::]:80;
    server_name memorymanager.getkapi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include /etc/nginx/snippets/memorymanager-site.conf;
}
