# memorymanager.getkapi.com with TLS. Port 80 only answers Let's Encrypt renewals and
# redirects everything else to HTTPS. The certificate comes from
# `deploy/deploy.sh tls` (certbot, webroot method) and renews via certbot.timer.

server {
    listen 80;
    listen [::]:80;
    server_name memorymanager.getkapi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name memorymanager.getkapi.com;

    ssl_certificate     /etc/letsencrypt/live/memorymanager.getkapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorymanager.getkapi.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/memorymanager-site.conf;
}
