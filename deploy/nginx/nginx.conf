# nginx main config for dev-vm. Installed by deploy/deploy.sh to /etc/nginx/nginx.conf.
# Based on Ubuntu 24.04's default, with the privacy rules from docs/pm/legal/privacy.md:
#   - access log stores anonymized IPs only (IPv4 last octet zeroed, IPv6 cut to /48)
#   - error log goes to rsyslog, which anonymizes IPs the same way before writing
#     /var/log/nginx-errors/error.log (deploy/rsyslog/30-nginx-anon.conf); only 'crit' events,
#     and missing files aren't logged
#   - logs rotate daily and are deleted after 7 days (deploy/logrotate/nginx)

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log syslog:server=127.0.0.1:5514,tag=nginx,nohostname crit;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# Anonymized client address. Defined before any access_log uses it.
	map $remote_addr $remote_addr_anon {
		"~^(?<p>\d+\.\d+\.\d+)\.\d+$"            "$p.0";
		"~^(?<p>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" "$p::";
		default                                   "0.0.0.0";
	}
	log_format anon '$remote_addr_anon - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

	access_log /var/log/nginx/access.log anon;

	# Waitlist abuse limit, per client IP (kept in shared memory only, never logged).
	limit_req_zone $binary_remote_addr zone=waitlist:1m rate=10r/m;
	limit_req_status 429;
	log_not_found off;

	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
