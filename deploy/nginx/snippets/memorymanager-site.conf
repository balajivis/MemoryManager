# The MemoryManager landing page itself. Included by both memorymanager-http.conf
# (before TLS) and memorymanager-https.conf (after). Releases live in
# /var/www/memorymanager/releases/<commit>; "current" points at the live one.

root /var/www/memorymanager/current;
index index.html;
charset utf-8;
charset_types text/css text/plain;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Content-Security-Policy for the public pages, generated by `deploy.sh site` from the hashes of the
# release's inline <script>/<style> blocks. Locations with their own add_header (/board/) don't inherit it.
include /etc/nginx/snippets/memorymanager-csp*.conf;

# Custom 404 from site/404.html (root-absolute URLs, so it works at nested paths).
# If a release has no 404.html, nginx falls back to its built-in 404 page.
error_page 404 /404.html;
location = /404.html {
    internal;
}

location / {
    expires 5m;
    try_files $uri $uri/ =404;
}

# Waitlist API (server/waitlist.py on loopback). The email travels in the POST body only,
# and nginx never logs bodies. No add_header here: that would drop the server-level headers.
location = /api/waitlist {
    client_max_body_size 4k;
    limit_req zone=waitlist burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Blackboard v2 (team board for agents and humans). Not part of the public site: noindex,
# and robots.txt disallows /board/. API and websocket go to the Express service.
location /board/api/ {
    include /etc/nginx/snippets/board-allow*.conf;   # temporary Cloudflare-only allowlist while proxied (see deploy/README.md)
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1h;
    client_max_body_size 12m;   # voice notes: 2 min of audio
}
location /board/ {
    include /etc/nginx/snippets/board-allow*.conf;
    alias /opt/blackboard-v2/web/current/;
    try_files $uri $uri.html $uri/index.html /board/index.html;
    expires 5m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location /fonts/ {
    expires 1y;
}
