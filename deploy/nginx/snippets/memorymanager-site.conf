# The MemoryManager landing page itself. Included by both memorymanager-http.conf
# (before TLS) and memorymanager-https.conf (after). Releases live in
# /var/www/memorymanager/releases/<commit>; "current" points at the live one.

root /var/www/memorymanager/current;
index index.html;
charset utf-8;
charset_types text/css text/plain;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Custom 404 from site/404.html (root-absolute URLs, so it works at nested paths).
# If a release has no 404.html, nginx falls back to its built-in 404 page.
error_page 404 /404.html;
location = /404.html {
    internal;
}

location / {
    expires 5m;
    try_files $uri $uri/ =404;
}

# Waitlist API (server/waitlist.py on loopback). The email travels in the POST body only,
# and nginx never logs bodies. No add_header here: that would drop the server-level headers.
location = /api/waitlist {
    client_max_body_size 4k;
    limit_req zone=waitlist burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /fonts/ {
    expires 1y;
}
