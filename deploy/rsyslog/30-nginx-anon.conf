# nginx error log with anonymized IPs. Installed by deploy/deploy.sh to /etc/rsyslog.d/.
# nginx can't reformat its error log, so it sends errors here over local UDP instead of
# writing a file. mmanon zeroes the last IPv4 octet (and cuts IPv6 to /48) before
# anything is written, so a full visitor IP never reaches disk. The dedicated ruleset
# keeps these lines out of /var/log/syslog and the journal.

module(load="imudp")
module(load="mmanon")

input(type="imudp" address="127.0.0.1" port="5514" ruleset="nginx_anon")

template(name="nginx_err" type="string" string="%timegenerated:::date-rfc3339% %msg%\n")

ruleset(name="nginx_anon") {
    action(type="mmanon" ipv4.enable="on" ipv4.mode="zero" ipv4.bits="8"
           ipv6.enable="on" ipv6.anonmode="zero" ipv6.bits="80")
    action(type="omfile" file="/var/log/nginx-errors/error.log" template="nginx_err")
}
